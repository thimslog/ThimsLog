name: Auto Reconcile Pending Transactions

on:
  schedule:
    # Runs every 15 minutes (24/7, 100% Free on GitHub Actions)
    - cron: "*/15 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Transaction Reconciliation Endpoint
        run: |
          APP_URL="${{ secrets.APP_URL || 'https://thimslog.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || '' }}"

          ENDPOINT="$APP_URL/api/cron/reconcile-transactions"
          if [ -n "$CRON_SECRET" ]; then
            ENDPOINT="$ENDPOINT?secret=$CRON_SECRET"
          fi

          echo "Pinging transaction reconciliation at $ENDPOINT..."

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -e 's/.*HTTP_STATUS://')
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//')

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Transactions successfully reconciled!"
          else
            echo "⚠️ Reconciliation returned HTTP $HTTP_STATUS"
          fi
