name: Auto Reconcile Pending Transactions

on:
  schedule:
    # Runs every 10 minutes (24/7, 100% Free on GitHub Actions)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Transaction Reconciliation Endpoint
        run: |
          APP_URL="${{ secrets.APP_URL || 'https://thimslog.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || '' }}"

          # Strip trailing slash from APP_URL if present to avoid 308 redirects from double slashes
          APP_URL="${APP_URL%/}"

          ENDPOINT="$APP_URL/api/cron/reconcile-transactions"
          if [ -n "$CRON_SECRET" ]; then
            ENDPOINT="$ENDPOINT?secret=$CRON_SECRET"
          fi

          echo "Pinging transaction reconciliation at $ENDPOINT..."

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sSL -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "$ENDPOINT")
          BODY=$(cat "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ -n "$HTTP_STATUS" ] && [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "✅ Transactions successfully reconciled!"
          else
            echo "⚠️ Reconciliation returned HTTP $HTTP_STATUS"
            exit 1
          fi
